name: HelloWorld

options:
  bundleIdPrefix: com.example

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "1.1.1"

targets:
  HelloWorld:
    type: application
    platform: iOS
    deploymentTarget: "26.6.2"

    sources:
      - HelloWorld

    dependencies:
      - package: WhisperKit

    info:
      path: HelloWorld/Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HelloWorld
        SWIFT_VERSION: "5.0"

    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --config "$SRCROOT/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
