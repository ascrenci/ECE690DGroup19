name: HelloWorld

options:
  bundleIdPrefix: com.example

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "1.1.1"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.4.0"

targets:
  HelloWorld:
    type: application
    platform: iOS
    deploymentTarget: "26.6.2"

    sources:
      - path: HelloWorld
        excludes:
          - Models/t5_tokenizer   # bundled below as a folder reference so its files keep their names
      # Generated by model/convert_t5.py (the build workflow runs it). .mlpackage files above are compiled by Xcode.
      - path: HelloWorld/Models/t5_tokenizer
        type: folder
        optional: true

    dependencies:
      - package: WhisperKit
      - package: swift-transformers
        product: Tokenizers

    info:
      path: HelloWorld/Info.plist
      # XcodeGen regenerates Info.plist from these; edits to the file itself are overwritten.
      properties:
        CFBundleDisplayName: Hello World
        NSMicrophoneUsageDescription: Used to transcribe spoken math to notes.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HelloWorld
        SWIFT_VERSION: "5.0"

    scheme:
      testTargets:
        - HelloWorldTests

    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --config "$SRCROOT/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi

  # Stub: no tests yet. The Swift code needs a testability refactor first (see AGENTS.md section 3).
  HelloWorldTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.6.2"
    sources:
      - HelloWorldTests
    dependencies:
      - target: HelloWorld
