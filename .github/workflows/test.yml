name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r model/requirements-test.txt
      # 100% line + branch coverage is enforced by --cov-fail-under in pytest.ini
      - run: pytest
