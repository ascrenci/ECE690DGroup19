name: Build iOS App

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Converted model is ~300 MB and slow to produce, so cache it on the inputs that define it.
      - name: Cache Core ML T5 model
        id: t5-cache
        uses: actions/cache@v4
        with:
          path: HelloWorld/Models
          key: t5-coreml-${{ hashFiles('model/convert_t5.py', 'model/requirements.txt') }}

      - name: Convert T5 to Core ML
        if: steps.t5-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r model/requirements.txt
          python model/convert_t5.py --out HelloWorld/Models

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show generated files
        run: |
          ls -la
          find HelloWorld.xcodeproj -maxdepth 2 -type f

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build .ipa File
        run: |
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

#      - name: Upload app
#        uses: actions/upload-artifact@v4
#        with:
#          name: HelloWorld-app
#          path: build/Build/Products/Debug-iphoneos/HelloWorld.app
        
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/HelloWorld.app Payload/
          zip -r HelloWorld.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-ipa
          path: HelloWorld.ipa

