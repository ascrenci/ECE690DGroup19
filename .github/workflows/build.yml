name: Build iOS App

on:
  workflow_dispatch:


env:
  T5_RELEASE: t5-math-v3

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Converted model is ~300 MB and slow to produce, so cache it on the inputs that define it.
      - name: Cache Core ML T5 model
        id: t5-cache
        uses: actions/cache@v4
        with:
          path: HelloWorld/Models
          key: t5-coreml-${{ env.T5_RELEASE }}-${{ hashFiles('model/convert_t5.py', 'model/latex_chars.py', 'model/requirements.txt') }}

      - name: Convert T5 to Core ML
        if: steps.t5-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -r model/requirements.txt
          # Fine-tuned checkpoint is a release asset (too big for git); bump T5_RELEASE to use a new one.
          gh release download "$T5_RELEASE" --pattern "*.zip" --dir model/checkpoint-zip
          unzip -q model/checkpoint-zip/*.zip -d model/checkpoint
          python model/convert_t5.py --model model/checkpoint --out HelloWorld/Models

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show generated files
        run: |
          ls -la
          find HelloWorld.xcodeproj -maxdepth 2 -type f

      - name: Show Xcode version
        run: xcodebuild -version

      # Restored file mtimes let xcodebuild skip recompiling packages and the Core ML model.
      - name: Cache Xcode build
        uses: actions/cache@v4
        with:
          path: build
          key: xcode-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ hashFiles('project.yml') }}-
            xcode-${{ runner.os }}-

      - name: Build .ipa File
        run: |
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

#      - name: Upload app
#        uses: actions/upload-artifact@v4
#        with:
#          name: HelloWorld-app
#          path: build/Build/Products/Debug-iphoneos/HelloWorld.app
        
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/HelloWorld.app Payload/
          zip -r HelloWorld.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-ipa
          path: HelloWorld.ipa

